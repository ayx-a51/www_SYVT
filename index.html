<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' data: https://audio.syvt.me; connect-src 'self' https://audio.syvt.me; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SYVT</title>
<meta name="description" content="SYVT &mdash; words fall, you sort them. Swipe right if it is spelled correctly, left if it is not. Play the free levels here; SYVT+ is coming to Android.">
<meta name="theme-color" content="#e1e8ea">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="brand/syvt-app-mark-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="SYVT">
<meta property="og:description" content="Words fall. Swipe right if it is spelled correctly, left if it is not.">
<meta property="og:url" content="https://syvt.me/">
<meta property="og:image" content="https://syvt.me/og.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="manrope.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="syvt.css">
</head>
<body>

<!-- The field is the app's design space, 420 x 746.67, scaled to fit the
     viewport. Every number in the stylesheet and the script is a design px;
     --s is the one factor that converts, so what is drawn and what is
     simulated can never drift apart. -->
<div id="game" data-phase="idle">

  <!-- scenery behind the words -->
  <canvas id="sceneBack" aria-hidden="true"></canvas>
  <div id="aurora" aria-hidden="true"></div>
  <div id="dots" aria-hidden="true"></div>
  <i id="ceiling" aria-hidden="true"></i>

  <!-- the words themselves; tiles are appended here -->
  <div id="field"></div>

  <!-- the ground, painted over the pile so the stack sinks into it -->
  <canvas id="sceneFront" aria-hidden="true"></canvas>

  <div id="legend" aria-hidden="true">
    <div class="side left">
      <span class="chip"><svg viewBox="0 0 24 24"><path d="M14.5 5 7.5 12l7 7"/></svg></span>
      <span class="word" id="hintLeft"></span>
      <span class="chip blank"></span>
    </div>
    <div class="side right">
      <span class="chip blank"></span>
      <span class="word" id="hintRight"></span>
      <span class="chip"><svg viewBox="0 0 24 24"><path d="M9.5 5l7 7-7 7"/></svg></span>
    </div>
  </div>

  <div id="danger" aria-hidden="true"><i id="dangerLine"></i></div>
  <div id="grain" aria-hidden="true"></div>

  <div id="hud">
    <div id="scoreBlock">
      <span id="scoreKicker">SCORE</span>
      <!-- past the free ceiling the score stops counting and the overflow
           runs in its own counter: 150 is what compares with anyone else,
           the +X after it is not. -->
      <span id="scoreRow">
        <span id="score">0</span>
        <span id="scoreBonus" hidden>+0</span>
      </span>
    </div>
    <div id="hudMid">
      <button id="pauseBtn" type="button" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M9.4 7.6V16.4M14.6 7.6V16.4"/>
        </svg>
      </button>
      <!-- The voice, told by shape and by luminance rather than by colour, so
           the difference survives a colour-blind player and a bright window:
           a cone with two waves while it is on, a cone with a bar through it
           when it is off. The bar is knocked out of the cone rather than laid
           over it, so the chip's own fill shows through the gap either side
           and it reads as crossing the cone rather than growing out of it. -->
      <button id="voiceBtn" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <defs>
            <mask id="voiceCut" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
              <rect x="0" y="0" width="24" height="24" fill="#fff"/>
              <path d="M5.6 18.4 18.4 5.6" stroke="#000" stroke-width="5.2" stroke-linecap="round" fill="none"/>
            </mask>
          </defs>
          <g class="spoken">
            <path class="cone" d="M5 9.9H7.9L11.7 6.6V17.4L7.9 14.1H5Z"/>
            <path class="wave" d="M14.28 9.66A3.2 3.2 0 0 1 14.28 14.34"/>
            <path class="wave" d="M15.92 7.91A5.6 5.6 0 0 1 15.92 16.09"/>
          </g>
          <g class="muted">
            <path class="cone" d="M5 9.9H7.9L11.7 6.6V17.4L7.9 14.1H5Z" mask="url(#voiceCut)"/>
            <path class="bar" d="M5.6 18.4 18.4 5.6"/>
          </g>
        </svg>
      </button>
    </div>
    <div id="levelChip">
      <span id="levelLabel">LEVEL 1</span>
      <span id="levelBar"><i id="levelFill"></i></span>
    </div>
  </div>

  <div id="levelUp" aria-hidden="true">
    <i class="rule"></i><span id="levelUpLabel"></span><i class="rule"></i>
  </div>

  <div id="flash" aria-hidden="true"></div>

  <div id="pauseVeil" hidden>
    <h2 id="pauseTitle">PAUSED</h2>
    <button id="resumeBtn" class="pill primary" type="button">CONTINUE</button>
    <button id="quitBtn" class="pill secondary" type="button">End round</button>
  </div>

  <div id="overlay">
    <div id="panel">
      <!-- S, the funnel as the Y, VT: the app's own lockup, and the reason the
           mark is never shown beside it - the name already contains the funnel.
           The Y is assets/brand/syvt-glyph-y.svg verbatim, the icon's glyph with
           the word card knocked out of it by the even-odd rule.

           It carries no colour of its own. The letters take the theme's brand
           gradient through background-clip, which cannot reach an inline SVG
           child, so the Y repeats the same two stops in user space over the
           lockup's 1em line box. The two gradients differ only by face: the
           numbers are BRAND.md's CSS rows, and they depend on the font's own
           ascent, descent and cap factor, not on the palette. -->
      <div id="brand" role="img" aria-label="SYVT"><span class="lead" aria-hidden="true">S</span><svg class="y" aria-hidden="true" focusable="false" viewBox="12 20 96 88"><defs><linearGradient id="brandY-manrope" gradientUnits="userSpaceOnUse" x1="0" y1="0.077778" x2="0" y2="122.300000"><stop class="stop-a" offset="0" stop-color="#10282c"/><stop class="stop-b" offset="1" stop-color="#1c8f87"/></linearGradient><linearGradient id="brandY-fredoka" gradientUnits="userSpaceOnUse" x1="0" y1="0.292958" x2="0" y2="124.236620"><stop class="stop-a" offset="0" stop-color="#10282c"/><stop class="stop-b" offset="1" stop-color="#1c8f87"/></linearGradient></defs><path class="glyph" fill="url(#brandY-manrope)" fill-rule="evenodd" d="M18.66 29.98Q12.0 20.0,24.0 20.0L96.0 20.0Q108.0 20.0,101.34 29.98L75.33 69.01Q72.0 74.0,72.0 80.0L72.0 98.0Q72.0 108.0,62.0 108.0L58.0 108.0Q48.0 108.0,48.0 98.0L48.0 80.0Q48.0 74.0,44.67 69.01ZM39.61 42.25Q38.36 36.38,44.23 35.13L71.61 29.31Q77.48 28.06,78.73 33.93L80.39 41.75Q81.64 47.62,75.77 48.87L48.39 54.69Q42.52 55.94,41.27 50.07Z"/></svg><span class="tail" aria-hidden="true">VT</span></div>

      <p id="tagline"></p>

      <h1 id="overTitle" hidden>STACK OVERFLOW</h1>
      <div id="overStats" hidden>
        <div class="stat">
          <!-- one "i" for both columns: the same answer covers them -->
          <span class="val"><b id="statScore">0</b><em id="statScoreBonus" hidden><span class="n">+0</span><button id="scoreInfo" type="button"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7.33"/><circle class="dot" cx="8" cy="4.64" r=".96"/><path d="M8 7.36V11.7"/></svg></button></em></span>
          <i id="statScoreLbl">SCORE</i>
        </div>
        <div class="stat" id="bestStat">
          <span class="val"><b id="statBest">0</b><em id="statBestBonus" hidden><span class="n">+0</span></em></span>
          <i id="statBestLbl">BEST</i>
        </div>
      </div>

      <div id="themePicker"></div>

      <div id="langRow">
        <button class="lang" type="button" data-lang="en">English</button>
        <button class="lang" type="button" data-lang="de">Deutsch</button>
        <button class="lang" type="button" data-lang="fr">Français</button>
      </div>

      <button id="startBtn" type="button">START</button>

      <p id="legendText"></p>

      <!-- Not a link while the app is not public: there is nowhere to send
           anyone. When it lists, this becomes an <a> to the Play page again
           and the three offers below pass showBuy true. -->
      <p id="storeLink">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 2.6a9.4 9.4 0 1 0 0 18.8 9.4 9.4 0 0 0 0-18.8Zm.9 4.7v5l3.4 2-.9 1.5-4.3-2.6V7.3Z"/>
        </svg>
        <span id="storeLinkLabel"></span>
      </p>
    </div>
  </div>

  <!-- what a locked world, or the end of the free levels, brings up -->
  <div id="modal" hidden>
    <div id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <p id="modalBody"></p>
      <!-- hidden while the app is not public; openModal is passed showBuy
           false everywhere, so nothing here promises a store that has no page
           yet. Restore the href with the link above. -->
      <a id="modalBuy" class="pill primary" hidden></a>
      <button id="modalKeep" class="pill secondary" type="button"></button>
    </div>
  </div>

</div>

<script src="matter.min.js"></script>
<script src="words.js"></script>
<script src="scenery.js"></script>
<script src="voice.js"></script>
<script src="sfx.js"></script>
<script src="syvt.js"></script>
</body>
</html>
