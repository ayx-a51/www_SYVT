<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 136 136" role="img" aria-label="SYVT">
  <title>SYVT</title>
  <!-- The SYVT mark: a word card tilted inside a funnel, with the two answers
       beside it (coral left = misspelled, mint right = correctly spelled).
       The glyph is one path with the card knocked out by the even-odd rule.
       The plate is a centre glow made from the three brand colours, so the
       funnel stands in the light and the triangles sit on the darker ring.
       Same 120-unit box and 136-unit plate as the icon pipeline. -->
  <defs>
    <radialGradient id="plate" cx=".5" cy=".5" r="0.68">
      <stop offset="0" stop-color="#6E42EE"/>
      <stop offset=".55" stop-color="#2A1B84"/>
      <stop offset="1" stop-color="#08102C"/>
    </radialGradient>
  </defs>
  <rect x="-8" y="-8" width="136" height="136" rx="31" fill="url(#plate)"/>
  <path d="M18.66 29.98Q12.0 20.0,24.0 20.0L96.0 20.0Q108.0 20.0,101.34 29.98L75.33 69.01Q72.0 74.0,72.0 80.0L72.0 98.0Q72.0 108.0,62.0 108.0L58.0 108.0Q48.0 108.0,48.0 98.0L48.0 80.0Q48.0 74.0,44.67 69.01ZM39.61 42.25Q38.36 36.38,44.23 35.13L71.61 29.31Q77.48 28.06,78.73 33.93L80.39 41.75Q81.64 47.62,75.77 48.87L48.39 54.69Q42.52 55.94,41.27 50.07Z" fill="#FFFFFF" fill-rule="evenodd"/>
  <path d="M16.59 90.99Q12.0 89.0,16.59 87.01L37.41 77.99Q42.0 76.0,42.0 81.0L42.0 97.0Q42.0 102.0,37.41 100.01Z" fill="#FB7185"/>
  <path d="M103.41 90.99Q108.0 89.0,103.41 87.01L82.59 77.99Q78.0 76.0,78.0 81.0L78.0 97.0Q78.0 102.0,82.59 100.01Z" fill="#2DD4BF"/>
</svg>
