<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 136 136" role="img" aria-label="SYVT">
  <title>SYVT</title>
  <!-- The same mark as brand/syvt-mark.svg, inset into the app's deep violet
       plate: this is the launcher icon a visitor arrives from, and the two
       should be one thing. Copied from ../SYVT/assets/brand/syvt-icon.svg.

       No light-theme variant, unlike the mark this replaces. That one was
       near-black and needed one; the violet plate is its own ground and reads
       on either. Which also means no <style> block — this file is the source
       for apple-touch-icon.png (see make-icons.mjs), and the rasteriser
       resolves neither var() nor media queries. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5F36D0"/>
      <stop offset=".55" stop-color="#4A27AE"/>
      <stop offset="1" stop-color="#37198A"/>
    </linearGradient>
  </defs>
  <rect x="-8" y="-8" width="136" height="136" rx="31" fill="url(#plate)"/>
  <g fill="none" stroke-width="16" stroke-linecap="round">
    <path d="M14 38L51 76" stroke="#FB7185"/>
    <path d="M106 38L69 76" stroke="#2DD4BF"/>
  </g>
  <rect x="47" y="72" width="26" height="36" rx="11" fill="#FFFFFF"/>
  <circle cx="60" cy="28" r="24" fill="#FFD54A"/>
  <circle cx="51" cy="25" r="3.5" fill="#1E2646"/>
  <circle cx="69" cy="25" r="3.5" fill="#1E2646"/>
  <path d="M51 34q9 7 18 0" fill="none" stroke="#1E2646" stroke-width="3.5" stroke-linecap="round"/>
</svg>
