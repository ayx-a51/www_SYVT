<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SYVT</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2A1B84">
<script>
  /* GitHub Pages cannot issue a server-side redirect, but it does serve this
     file for any path it cannot resolve - so this doubles as the redirect
     table. The game used to live at y7.ai under a series of names and paths,
     and anyone carrying one of those will type it against this domain too, so
     they all land on the game rather than on nothing.

     Runs in <head>, before anything paints, so a matched path never flashes
     this page. Keep it dependency-free and synchronous for that reason. */
  (function () {
    var MOVED = {
      "/syvt": "/",           // the path it had while it lived on y7.ai
      "/sift": "/",           // and the name before that
      "/spelling": "/",       // and before that
      "/spelling.html": "/",
      // the legal pages, which get typed and pasted without their extension
      "/privacy": "/privacy.html",
      "/privacy-policy": "/privacy.html",
      "/data-deletion": "/data_deletion.html",
      "/data_deletion": "/data_deletion.html",
      "/delete": "/data_deletion.html"
    };
    var here = location.pathname;
    var to = MOVED[here.toLowerCase().replace(/\/+$/, "")];
    // the guard matters: without it a matched path could map to itself and
    // spin, if this file were ever served for a path that does resolve
    if (to && to !== here) location.replace(to + location.search + location.hash);
  })();
</script>
<style>
  html, body { height: 100%; }
  /* The plate, full bleed: one centred radial of the three brand colours,
     the same picture as the icon that brought the reader here. BRAND.md
     section 2. The stops interpolate in sRGB - naming a colour space here
     would shift the mid violet and stop being the same picture. */
  body {
    margin: 0;
    background: radial-gradient(68% 68% at 50% 50%,
                                #6E42EE 0%, #2A1B84 55%, #08102C 100%);
    background-color: #08102C;   /* what the gradient clamps to, past its rim */
    color: rgba(255, 247, 230, .90);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  /* The funnel takes the surrounding text colour; the two triangles keep the
     game's verdict colours and must not. BRAND.md section 8.

     The drawn ink runs y 20 to 108 of the 120 box, so its centre is y 64, not
     60. Centring the viewBox would sit the mark four units of 120 low, which
     is why the box is nudged up by that much: 4/120 of its own height. */
  .mark {
    width: min(26vw, 104px);
    height: auto;
    display: block;
    color: #FFFFFF;
    margin-top: calc(min(26vw, 104px) * -4 / 120);
  }
  p {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255, 247, 230, .90);
  }
  a {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #FFF7E6;
    text-decoration: none;
    transition: color 0.45s ease;
  }
  /* Not mint on hover. Coral and mint are the game's verdict pair and carry
     meaning wherever they appear; a link that borrows one is spending that
     meaning on decoration, on a page that is already showing the mark. */
  a:hover, a:focus-visible { color: #FFFFFF; }
  a:focus-visible { outline: 1px solid #FFF7E6; outline-offset: 6px; }
  /* No entrance fade, deliberately. An `animation: ... both` starts at
     opacity 0 and only becomes visible if the animation actually runs - a bad
     bet on the page people reach when something has already gone wrong. This
     one is visible the moment it paints. Matched paths never paint it at all;
     they redirect from <head>. */
</style>
</head>
<body>

<!-- brand/syvt-mark.svg inline, because this page loads nothing: its policy

     all can still paint. Copied from ../SYVT/assets/brand/syvt-mark.svg; the
     fill-rule is what keeps the card a hole rather than filling it in. -->

</html>
