<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="SYVT">
  <title>SYVT</title>
  <!-- The SYVT mark: a round face drops into a funnel whose walls carry the
       verdict colours, coral for wrong on the left and mint for right on the
       right. One word falls in; it leaves either left or right.

       This is the app's drawing, unit for unit — ../SYVT/assets/brand/syvt-mark.svg,
       which lib/ui/marks.dart draws and tool/render_icons_test.dart renders
       the launcher sources from. The wide rim (92 units across) is this, the
       standalone mark; the narrow one (72 across, no ball) is the funnel that
       serves as the Y of the wordmark. Flat, no outlines.

       The spout is white here because the mark is only ever shown on the
       violet plate or another dark ground. In the wordmark it takes the
       wordmark's own ink instead. -->
  <g fill="none" stroke-width="16" stroke-linecap="round">
    <path d="M14 38L51 76" stroke="#FB7185"/>
    <path d="M106 38L69 76" stroke="#2DD4BF"/>
  </g>
  <rect x="47" y="72" width="26" height="36" rx="11" fill="#FFFFFF"/>
  <circle cx="60" cy="28" r="24" fill="#FFD54A"/>
  <circle cx="51" cy="25" r="3.5" fill="#1E2646"/>
  <circle cx="69" cy="25" r="3.5" fill="#1E2646"/>
  <path d="M51 34q9 7 18 0" fill="none" stroke="#1E2646" stroke-width="3.5" stroke-linecap="round"/>
</svg>
